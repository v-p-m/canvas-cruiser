<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Canvas Cruiser — Phaser port</title>
        <script>
            // The 0.14.0 port target. index.html is untouched and still runs
            // the legacy loop, so both can be opened side by side.
            window.BUILD = "0.14.0-dev";
        </script>
    </head>
    <body style="margin: 0; background: #111">
        <div id="game"></div>

        <script>
            for (const src of [
                "vendor/phaser.min.js",
                "track.js",
                "rain.js",
                "night.js",
                "sound.js",
                "quality.js",
                // The opponent driver and the numbers it drives on, straight
                // out of the legacy game: debugConfig.js is loaded for its
                // defaults literal only (init() wants globals game.js owns),
                // engineClass.js and rain.js hand out scalars, and ai.js needs
                // no changes at all — drive() already returns the input shape
                // MatterCar.step takes.
                "debugConfig.js",
                "engineClass.js",
                "ai.js",
                // The real car art. Bakes to a canvas per livery — see
                // phaser/renderScale.js for who tells it when to re-bake.
                "carSprites.js",
                "phaser/carStats.js",
                "phaser/matterCar.js",
                "phaser/raceGrid.js",
                "phaser/raceLaps.js",
                "phaser/raceConditions.js",
                // camera/viewZoom/ctx: the globals rain.js and night.js read
                // to draw, standing in for game.js's own so both files run on
                // this page completely unmodified. Needed before renderScale.js,
                // which is what keeps camera.width/height current.
                "phaser/worldCamera.js",
                "phaser/renderScale.js",
                // window keydown/mousedown -> Sound.unlock(), and the M mute
                // toggle, the same two hooks game.js wires on its own canvas
                // and window listeners.
                "phaser/soundHooks.js",
                // Step 5: the UI overlay. menuData.js is the picker's own
                // copy of TRACKS/MODES (see its header for why it's not
                // shared with game.js), uiCanvas.js is the overlay <canvas>
                // every screen in this step draws onto. records.js is the
                // lap/total-times store (its own physics-version reset, not
                // shared game.js globals); the *Screen.js files are the
                // ported draw+hit-test for each screen, loaded before the
                // scenes/RaceScene that call them every frame; credits.js is
                // the data loader (credits.json, with its built-in fallback).
                "phaser/menuData.js",
                "phaser/uiCanvas.js",
                "phaser/records.js",
                "phaser/credits.js",
                "phaser/menuScreen.js",
                "phaser/hudScreen.js",
                "phaser/recordsScreen.js",
                "phaser/resultsScreen.js",
                "phaser/creditsScreen.js",
                "phaser/raceScene.js",
                "phaser/menuScene.js",
                "phaser/recordsScene.js",
            ]) {
                const s = document.createElement("script");
                s.src = `${src}?v=${window.BUILD}`;
                s.async = false;
                document.head.appendChild(s);
            }

            window.addEventListener("load", () => {
                window.phaserGame = new Phaser.Game({
                    type: Phaser.AUTO,
                    parent: "game",
                    width: window.innerWidth,
                    height: window.innerHeight,
                    physics: {
                        default: "matter",
                        matter: { gravity: { x: 0, y: 0 }, debug: false },
                    },
                    // MenuScene is first, so Phaser starts on it; it starts
                    // RaceScene on START and RecordsScene on Q. RaceScene
                    // hands back to either once the flag falls.
                    scene: [MenuScene, RaceScene, RecordsScene],
                });
            });
        </script>
    </body>
</html>
