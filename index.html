<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Canvas Cruiser</title>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="favicon-32.png" sizes="32x32" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <script>
            // Browsers cache by full URL, so this query string is what makes a
            // returning player fetch the new files — and fetch them as a *set*.
            // Without it the cache expires per file and someone ends up running
            // new game.js against old ai.js. It lives here because index.html is
            // the only file GitHub Pages will let go stale for just 10 minutes;
            // a constant inside game.js cannot invalidate game.js.
            window.BUILD = "0.14.0-dev";

            const css = document.createElement("link");
            css.rel = "stylesheet";
            css.href = `style.css?v=${window.BUILD}`;
            document.head.appendChild(css);
        </script>
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>

        <script>
            // Load order matters — see CLAUDE.md. Injected scripts default to
            // async, so async=false is what keeps them executing in this order.
            // Phaser is vendored rather than pulled from a CDN so the "serve
            // the folder and reload" dev loop keeps working offline, and so a
            // CDN outage cannot take the game down. It is first because every
            // scene file below reads the `Phaser` global at parse time.
            for (const src of [
                "vendor/phaser.min.js",
                "track.js",
                "trackEditor.js",
                "carSprites.js",
                "ai.js",
                "startLights.js",
                "waypointEditor.js",
                "debugHUD.js",
                "engineClass.js",
                "debugConfig.js",
                "keyBindings.js",
                "sound.js",
                "rain.js",
                "night.js",
                "quality.js",
                "screens.js",
                "game.js",
            ]) {
                const s = document.createElement("script");
                s.src = `${src}?v=${window.BUILD}`;
                s.async = false;
                document.head.appendChild(s);
            }

            window.addEventListener("load", () => {
                document.title = `Canvas Cruiser ${GAME_VERSION}`;
            });
        </script>
    </body>
</html>
