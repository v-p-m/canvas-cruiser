<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Canvas Cruiser</title>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="favicon-32.png" sizes="32x32" />
        <link rel="apple-touch-icon" href="apple-touch-icon.png" />
        <script>
            // Browsers cache by full URL, so this query string is what makes a
            // returning player fetch the new files — and fetch them as a *set*.
            // Without it the cache expires per file and someone ends up running
            // new raceScene.js against old ai.js. It lives here because
            // index.html is the only file GitHub Pages will let go stale for
            // just 10 minutes; a constant inside a script cannot invalidate
            // that script.
            window.BUILD = "0.21.0";
        </script>
        <style>
            /* Not shared with editor.html's own block: that one pins the
               canvas to the viewport with position:fixed/100vw, which would
               fight RenderScale.apply()'s explicit CSS size. These are the
               three rules of it that still apply here: a canvas left at its
               default display:inline sits on a text baseline, and the few
               pixels of descender space under it grow #game past the viewport
               and put a scrollbar on the page. */
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                background: #111;
            }
            canvas {
                display: block;
            }
        </style>
    </head>
    <body>
        <div id="game"></div>

        <script>
            for (const src of [
                "vendor/phaser.min.js",
                "shared/track.js",
                "shared/rain.js",
                "shared/night.js",
                "shared/sound.js",
                // The grid-start countdown — Sound.beep() above is the only
                // thing it calls, and raceScene.js is the only thing that
                // calls it, so it just needs to land somewhere before that.
                "shared/startLights.js",
                "shared/quality.js",
                // The opponent driver and the numbers it drives on. This page
                // does not load debugConfig.js: that panel tunes the legacy
                // loop, and it lives on editor.html now, so ai.js and
                // carStats.js carry the shipped numbers themselves and treat
                // the panel as an override that may not be there. engineClass.js
                // and rain.js hand out scalars, and ai.js needs no changes at
                // all — drive() already returns the input shape MatterCar.step
                // takes.
                "shared/engineClass.js",
                "shared/ai.js",
                "shared/carStats.js",
                // The real car art. Bakes to a canvas per livery — see
                // phaser/renderScale.js for who tells it when to re-bake.
                "shared/carSprites.js",
                // Remappable controls, straight out of the legacy game and
                // unmodified: keyBindings.js owns the store and the rebind
                // screen's own drawing, phaser/playerInput.js is what turns a
                // binding into the four booleans RaceScene feeds MatterCar.
                "shared/keyBindings.js",
                "phaser/playerInput.js",
                "phaser/matterCar.js",
                // What a car-to-car hit costs. Reads MATTER_CAR above for the
                // restitution it has to predict, and feeds back the `spin` and
                // `unsettle` matterCar.js decays.
                "phaser/impacts.js",
                // What a hit costs *permanently*: the wings, and the mods a
                // missing one rewrites. After carStats.js (it calls
                // applyCarStats) and beside impacts.js, which is what triggers
                // it — and after carSprites.js, whose grid it blanks rows of.
                "phaser/damage.js",
                // Rubber on the road. Reads carSprites.js's sprite grid for
                // where the tires are, and rain.js for how wet it is.
                "phaser/skidMarks.js",
                "phaser/raceGrid.js",
                // The rivals' names and characters, in the grid order
                // raceGrid.js deals the liveries in. Pure data; raceScene.js
                // hands each profile to ai.js's rollDriver().
                "phaser/drivers.js",
                // People on foot. human.js is the figure with no job — the
                // grid, the bake, and the march off the road that finds it a
                // spot — and reads carSprites.js's own mixHex/mixColor for how
                // a colour is shaded and dimmed. The two roles over it are
                // marshal.js, which reads raceGrid.js above for where the start
                // line it stands at is, and crowd.js, which needs neither and
                // walks the waypoint ring for its own spots.
                "phaser/human.js",
                "phaser/marshal.js",
                "phaser/crowd.js",
                "phaser/raceLaps.js",
                "phaser/raceConditions.js",
                // camera/viewZoom/ctx: the globals rain.js and night.js read
                // to draw, standing in for game.js's own so both files run on
                // this page completely unmodified. Needed before renderScale.js,
                // which is what keeps camera.width/height current.
                "phaser/worldCamera.js",
                "phaser/renderScale.js",
                // window keydown/mousedown -> Sound.unlock(), and the M mute
                // toggle, the same two hooks game.js wires on its own canvas
                // and window listeners.
                "phaser/soundHooks.js",
                // Step 5: the UI overlay. menuData.js is the picker's own
                // copy of TRACKS/MODES (see its header for why it's not
                // shared with game.js), uiCanvas.js is the overlay <canvas>
                // every screen in this step draws onto. records.js is the
                // lap/total-times store (its own physics-version reset, not
                // shared game.js globals); garage.js is the part-upgrade
                // store next to it, same shape, no physics version to carry;
                // the *Screen.js files are the ported draw+hit-test for each
                // screen, loaded before the scenes/RaceScene that call them
                // every frame; credits.js is the data loader (credits.json,
                // with its built-in fallback).
                //
                // series.js goes before menuData.js, which builds the
                // series row of its MODE table out of SERIES_ROUNDS/
                // SERIES_LAPS rather than a second copy of those numbers. Series itself only reaches for
                // PHASER_TRACKS/Garage inside its methods, so this is the one
                // ordering constraint it has beyond engineClass.js above.
                "phaser/series.js",
                "phaser/menuData.js",
                "phaser/uiCanvas.js",
                // The record lap's trace and its playback. Before records.js,
                // which clears it alongside the times it belongs to.
                "phaser/ghost.js",
                "phaser/records.js",
                "phaser/garage.js",
                "phaser/credits.js",
                "phaser/debugOverlay.js",
                "phaser/menuScreen.js",
                "phaser/hudScreen.js",
                "phaser/recordsScreen.js",
                "phaser/garageScreen.js",
                "phaser/seriesScreen.js",
                "phaser/resultsScreen.js",
                "phaser/creditsScreen.js",
                "phaser/raceScene.js",
                "phaser/menuScene.js",
                "phaser/recordsScene.js",
                "phaser/garageScene.js",
                "phaser/seriesScene.js",
            ]) {
                const s = document.createElement("script");
                s.src = `${src}?v=${window.BUILD}`;
                s.async = false;
                document.head.appendChild(s);
            }

            window.addEventListener("load", () => {
                document.title = `Canvas Cruiser ${window.BUILD}`;

                // Page-level: both scenes read the bindings, and neither owns
                // them.
                KeyBindings.load();

                window.phaserGame = new Phaser.Game({
                    type: Phaser.AUTO,
                    parent: "game",
                    width: window.innerWidth,
                    height: window.innerHeight,
                    physics: {
                        default: "matter",
                        matter: { gravity: { x: 0, y: 0 }, debug: false },
                    },
                    // MenuScene is first, so Phaser starts on it; it starts
                    // RaceScene on START, RecordsScene on Q and GarageScene
                    // on G. RaceScene hands back to the menu once the flag
                    // falls. SeriesScene is the championship's own screen: the
                    // menu opens it on the series mode, every round is started
                    // from it, and every round's results screen returns to it.
                    scene: [MenuScene, RaceScene, RecordsScene, GarageScene, SeriesScene],
                });
            });
        </script>
    </body>
</html>
