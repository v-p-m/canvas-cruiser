<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Canvas Cruiser — editor</title>
        <link rel="icon" href="favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="favicon-32.png" sizes="32x32" />
        <script>
            // The authoring page: the tile map editor (T), the AI waypoint
            // editor (E) and the tuning panel (C).
            //
            // It runs the pre-0.14 canvas loop, and that is the point rather
            // than an accident. The editors are woven into it — the free
            // camera, screenToWorld*/viewZoom, the mouse handlers, the draw
            // pass — and the waypoint editor's pace car is a real AICar driven
            // through stepCarControls/stepCarMotion. Porting all of that to
            // Phaser would buy a second copy of a tool whose output is a track
            // file, and a track file is renderer-independent: what is authored
            // here is exactly what index.html races.
            //
            // The one thing to know while using it: the pace car previews the
            // line under legacy physics, and the game runs on Matter, which
            // laps a couple of percent quicker. The ring it reveals is the
            // right ring — same ai.js, same geometry — but the lap time it
            // implies is not the game's. Read it for the line, not the clock.
            window.BUILD = "0.22.0";
            window.EDITOR_PAGE = true;
        </script>
        <style>
            /* Inline rather than a sheet because index.html cannot share it:
               pinning the canvas at 100vw/100vh is what this page's free
               camera wants and exactly what fights RenderScale.apply()'s
               explicit CSS size over there. Two pages, two sets of three
               rules — see index.html's own block for the other half. */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                background: #111;
                overflow: hidden;
            }
            canvas {
                display: block;
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: #222;
            }
        </style>
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>

        <script>
            // Load order matters — see CLAUDE.md. Injected scripts default to
            // async, so async=false is what keeps them executing in this order.
            //
            // shared/ is the files both pages load; everything under
            // editor/ exists only here. That split is the directory layout's
            // job — if a file in shared/ grows a `DebugConfig.x` that isn't
            // behind a `typeof` guard, it has just broken index.html.
            for (const src of [
                "shared/track.js",
                "editor/trackEditor.js",
                "shared/carStats.js",
                "shared/carSprites.js",
                "shared/ai.js",
                "shared/startLights.js",
                "editor/waypointEditor.js",
                "editor/debugHUD.js",
                "shared/engineClass.js",
                // After ai.js and carStats.js: the panel seeds its defaults
                // from their constants rather than keeping a second copy.
                "editor/debugConfig.js",
                "shared/keyBindings.js",
                "shared/sound.js",
                "shared/rain.js",
                "shared/night.js",
                "shared/quality.js",
                "editor/screens.js",
                "editor/game.js",
            ]) {
                const s = document.createElement("script");
                s.src = `${src}?v=${window.BUILD}`;
                s.async = false;
                document.head.appendChild(s);
            }

            window.addEventListener("load", () => {
                document.title = `Canvas Cruiser editor ${GAME_VERSION}`;
            });
        </script>
    </body>
</html>
